<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Deep space dark background circle -->
  <rect width="64" height="64" rx="14" fill="#07090E" />

  <!-- Outer Orbit Ellipse -->
  <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="url(#ringGrad)" stroke-width="2" transform="rotate(-28 32 32)" stroke-dasharray="3 2" />

  <!-- Atmosphere Glow -->
  <circle cx="32" cy="32" r="17" fill="url(#glowGrad)" />

  <!-- Primary Planet -->
  <circle cx="32" cy="32" r="14" fill="url(#planetGrad)" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Continent / Terrain Accent -->
  <path d="M26 24 Q30 22 34 26 Q36 30 32 34 Q28 36 24 32 Z" fill="#10b981" fill-opacity="0.4" />

  <!-- Mars companion orbiter -->
  <circle cx="51" cy="20" r="3" fill="#f97316" stroke="#fbbf24" stroke-width="0.8" />

  <!-- Moon beacon -->
  <circle cx="15" cy="42" r="2" fill="#e2e8f0" />

  <!-- Active Telemetry Satellite blip -->
  <circle cx="43" cy="26" r="1.5" fill="#22d3ee" />
</svg>
